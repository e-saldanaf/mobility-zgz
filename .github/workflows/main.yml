name: Run Mobility Zgz ETL

on:
  schedule:
    # Ejecuta el pipeline cada 5 minutos (Formato Cron)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutar el pipeline manualmente desde la web de GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4 # <-- Corregido aquí

    - name: Set up Python
      uses: actions/setup-python@v5 # <-- Corregido aquí
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute ETL Pipeline
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python main.py