name: Run Mobility Zgz ETL

on:
  schedule:
    # Ejecuta el pipeline cada 5 minutos (Formato Cron)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecutar el pipeline manualmente desde la web de GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/actions/checkout@v4

    - name: Set up Python
      uses: actions/actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # Optimiza el tiempo de ejecución cacheando las librerías

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute ETL Pipeline
      env:
        # Inyectamos el secreto de GitHub como variable de entorno para el script
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python main.py